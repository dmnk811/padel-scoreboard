<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Padel-Scorepad</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-default: #161e2e;
      --text-color: #f8fafc;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(22, 30, 46, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .scoreboard-container {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 1000px;
      flex: 1;
      margin: 12px 0;
    }

    @media (max-width: 700px) and (orientation: portrait) {
      .scoreboard-container {
        flex-direction: column;
      }
    }

    .team-card {
      position: relative;
      flex: 1;
      background-color: var(--card-default);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transition: background-color 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .team-card-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 2;
    }

    .team-name-input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      padding: 8px;
      flex-grow: 1;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    .team-name-input:focus {
      outline: none;
      border-color: var(--accent-color);
      background: rgba(0, 0, 0, 0.4);
    }

    .color-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-picker-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .color-picker-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .color-select-hidden {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .sets-display {
      font-size: 1rem;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .score-display {
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 900;
      color: var(--accent-color);
      line-height: 1;
      text-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
      user-select: none;
      margin: auto 0;
    }

    .manual-controls {
      display: flex;
      gap: 10px;
      width: 100%;
      z-index: 2;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-bluetooth {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .btn-bluetooth:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .btn-fullscreen {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-reset {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-reset:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }

    footer {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 5px 0;
    }

    /* Veredelte Team-Farbschemata */
    .bg-dark { background-color: #161e2e; }
    .bg-blue { background-color: #172554; border-color: rgba(59, 130, 246, 0.3); }
    .bg-red { background-color: #451a03; border-color: rgba(239, 68, 68, 0.3); }
    .bg-green { background-color: #064e3b; border-color: rgba(16, 185, 129, 0.3); }
    .bg-purple { background-color: #3b0764; border-color: rgba(168, 85, 247, 0.3); }
    .bg-yellow { background-color: #422006; border-color: rgba(234, 179, 8, 0.3); }
    .bg-orange { background-color: #431407; border-color: rgba(249, 115, 22, 0.3); }
  </style>
</head>
<body>

  <header>
    <h1>Padel-Scorepad</h1>
    <div class="header-actions">
      <button class="btn btn-bluetooth" id="bt-connect-btn" onclick="connectBluetoothDevice()">Sender verbinden 📶</button>
      <button class="btn btn-fullscreen" onclick="toggleFullscreen()">Vollbild ⛶</button>
    </div>
  </header>

  <div class="scoreboard-container">
    <!-- TEAM A -->
    <div class="team-card bg-dark" id="card-a" onclick="handleCardClick(event, 'a')">
      <div class="team-card-header" onclick="event.stopPropagation()">
        <input type="text" class="team-name-input" id="name-a" value="Team A" placeholder="Team A">
        <div class="color-picker-wrapper" title="Farbe ändern">
          <div class="color-picker-btn">🎨</div>
          <select class="color-select-hidden" onchange="changeColor('card-a', this.value)">
            <option value="bg-dark">Dunkelgrau</option>
            <option value="bg-blue">Blau</option>
            <option value="bg-red">Rot</option>
            <option value="bg-green">Grün</option>
            <option value="bg-yellow">Gelb</option>
            <option value="bg-purple">Violett</option>
            <option value="bg-orange">Orange</option>
          </select>
        </div>
      </div>

      <div class="sets-display">Sätze: <span id="sets-a">0</span></div>
      <div class="score-display" id="score-a">0</div>

      <div class="manual-controls" onclick="event.stopPropagation()">
        <button class="btn" onclick="addPoint('a')">+ Punkt</button>
        <button class="btn" onclick="undoPoint()">Rückgängig</button>
      </div>
    </div>

    <!-- TEAM B -->
    <div class="team-card bg-dark" id="card-b" onclick="handleCardClick(event, 'b')">
      <div class="team-card-header" onclick="event.stopPropagation()">
        <input type="text" class="team-name-input" id="name-b" value="Team B" placeholder="Team B">
        <div class="color-picker-wrapper" title="Farbe ändern">
          <div class="color-picker-btn">🎨</div>
          <select class="color-select-hidden" onchange="changeColor('card-b', this.value)">
            <option value="bg-dark">Dunkelgrau</option>
            <option value="bg-blue">Blau</option>
            <option value="bg-red">Rot</option>
            <option value="bg-green">Grün</option>
            <option value="bg-yellow">Gelb</option>
            <option value="bg-purple">Violett</option>
            <option value="bg-orange">Orange</option>
          </select>
        </div>
      </div>

      <div class="sets-display">Sätze: <span id="sets-b">0</span></div>
      <div class="score-display" id="score-b">0</div>

      <div class="manual-controls" onclick="event.stopPropagation()">
        <button class="btn" onclick="addPoint('b')">+ Punkt</button>
        <button class="btn" onclick="undoPoint()">Rückgängig</button>
      </div>
    </div>
  </div>

  <footer>
    <button class="btn btn-reset" onclick="resetGame()">Spiel zurücksetzen</button>
  </footer>

  <script>
    const pointsSequence = ["0", "15", "30", "40", "V"];
    
    let state = {
      scoreA: 0,
      scoreB: 0,
      setsA: 0,
      setsB: 0,
      history: []
    };

    function updateDisplay() {
      document.getElementById('score-a').innerText = pointsSequence[state.scoreA] || "40";
      document.getElementById('score-b').innerText = pointsSequence[state.scoreB] || "40";
      document.getElementById('sets-a').innerText = state.setsA;
      document.getElementById('sets-b').innerText = state.setsB;
    }

    function addPoint(team) {
      saveState();
      if (team === 'a') {
        if (state.scoreA === 3 && state.scoreB === 3) {
          state.scoreA = 4;
        } else if (state.scoreB === 4) {
          state.scoreB = 3;
        } else if (state.scoreA >= 3 && state.scoreB < 3) {
          winGame('a');
          return;
        } else if (state.scoreA === 4) {
          winGame('a');
          return;
        } else {
          state.scoreA++;
        }
      } else if (team === 'b') {
        if (state.scoreA === 3 && state.scoreB === 3) {
          state.scoreB = 4;
        } else if (state.scoreA === 4) {
          state.scoreA = 3;
        } else if (state.scoreB >= 3 && state.scoreA < 3) {
          winGame('b');
          return;
        } else if (state.scoreB === 4) {
          winGame('b');
          return;
        } else {
          state.scoreB++;
        }
      }
      updateDisplay();
    }

    function winGame(team) {
      if (team === 'a') state.setsA++;
      else state.setsB++;
      
      state.scoreA = 0;
      state.scoreB = 0;
      updateDisplay();
    }

    function undoPoint() {
      if (state.history.length > 0) {
        const lastState = state.history.pop();
        state.scoreA = lastState.scoreA;
        state.scoreB = lastState.scoreB;
        state.setsA = lastState.setsA;
        state.sets
