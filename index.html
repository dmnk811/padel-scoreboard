<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Scoreboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #111; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            user-select: none;
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .container { display: flex; justify-content: space-around; margin-top: 30px; flex-wrap: wrap; }
        .team { 
            background: #222; 
            padding: 20px; 
            border-radius: 15px; 
            width: 42%; 
            min-width: 250px; 
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .score { font-size: 7rem; margin: 10px 0; color: #4CAF50; font-weight: bold; }
        .sets { font-size: 1.5rem; color: #aaa; margin-bottom: 15px; }
        .controls { margin-top: 20px; }
        button { 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            padding: 10px 20px; 
            font-size: 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 5px;
        }
        button:hover { background: #444; }
        .reset-btn { background: #d9534f; border: none; }
        .reset-btn:hover { background: #c9302c; }
        #info { margin-top: 20px; font-size: 0.9rem; color: #888; background: #1a1a1a; padding: 10px; border-radius: 8px; display: inline-block;}
    </style>
</head>
<body>

    <h1>Padel Scoreboard</h1>
    <div id="info">Drücke Tasten auf deinen Remote-Sendern zum Testen</div>

    <div class="container">
        <!-- Team A -->
        <div class="team">
            <h2>Team A</h2>
            <div class="sets" id="setsA">Sätze: 0</div>
            <div class="score" id="scoreA">0</div>
            <div class="controls">
                <button onclick="modifyScore('A', 1)">+1 Punkt</button>
                <button onclick="modifyScore('A', -1)">-1</button>
            </div>
        </div>

        <!-- Team B -->
        <div class="team">
            <h2>Team B</h2>
            <div class="sets" id="setsB">Sätze: 0</div>
            <div class="score" id="scoreB">0</div>
            <div class="controls">
                <button onclick="modifyScore('B', 1)">+1 Punkt</button>
                <button onclick="modifyScore('B', -1)">-1</button>
            </div>
        </div>
    </div>

    <br>
    <button class="reset-btn" onclick="resetMatch()">Spiel zurücksetzen</button>

    <script>
        let scoreA = 0;
        let scoreB = 0;
        let setsA = 0;
        let setsB = 0;

        // Hilfs-Variablen für Klick-Erkennung (1x Klick vs. 2x Klick)
        let clickData = {};

        function modifyScore(team, amount) {
            if (team === 'A') {
                scoreA = Math.max(0, scoreA + amount);
            } else {
                scoreB = Math.max(0, scoreB + amount);
            }
            updateDisplay();
        }

        function resetMatch() {
            if (confirm("Wirklich alles zurücksetzen?")) {
                scoreA = 0; scoreB = 0;
                setsA = 0; setsB = 0;
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('scoreA').innerText = scoreA;
            document.getElementById('scoreB').innerText = scoreB;
            document.getElementById('setsA').innerText = "Sätze: " + setsA;
            document.getElementById('setsB').innerText = "Sätze: " + setsB;
        }

        // Intelligente Klick-Logik pro Sender/Taste
        function handleRemoteAction(actionKey) {
            let now = new Date().getTime();
            if (!clickData[actionKey]) {
                clickData[actionKey] = { count: 0, lastTime: 0 };
            }

            if (now - clickData[actionKey].lastTime < 400) {
                clickData[actionKey].count++;
            } else {
                clickData[actionKey].count = 1;
            }
            clickData[actionKey].lastTime = now;

            setTimeout(() => {
                if (clickData[actionKey].count === 1) {
                    // 1x Klicken = Punkt für Team
                    if (actionKey === 'TEAM_A') modifyScore('A', 1);
                    if (actionKey === 'TEAM_B') modifyScore('B', 1);
                } else if (clickData[actionKey].count >= 2) {
                    // 2x Klicken = Punkt zurück (Undo)
                    if (actionKey === 'TEAM_A') modifyScore('A', -1);
                    if (actionKey === 'TEAM_B') modifyScore('B', -1);
                }
                clickData[actionKey].count = 0;
            }, 400);
        }

        // Tastatur-Lauscher (reagiert auf die Bluetooth-Fernbedienungen)
        window.addEventListener('keydown', (e) => {
            // Zeige an, welche Taste gedrückt wurde (hilft beim Testen mit den neuen Sendern)
            document.getElementById('info').innerText = "Letztes Signal: " + e.code + " (Key: " + e.key + ")";

            // Hier kannst du später mappen, welche Taste von welchem Sender was auslöst:
            // Beispiel: Sender 1 sendet "PageUp" / "Volume Up" -> Team A
            //           Sender 2 sendet "PageDown" / "Volume Down" -> Team B
            if (e.key === "PageUp" || e.code === "ArrowUp" || e.key === "AudioVolumeUp") {
                handleRemoteAction('TEAM_A');
            }
            if (e.key === "PageDown" || e.code === "ArrowDown" || e.key === "AudioVolumeDown") {
                handleRemoteAction('TEAM_B');
            }
        });
    </script>
</body>
</html>
