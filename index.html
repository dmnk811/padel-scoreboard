<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Scoreboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { display: flex; justify-content: space-around; margin-top: 50px; }
        .team { font-size: 2rem; background: #222; padding: 30px; border-radius: 15px; width: 40%; }
        .score { font-size: 8rem; margin: 20px 0; color: #4CAF50; }
        button { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #45a049; }
        #status { margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>

    <h1>Padel Scoreboard (Bluetooth Remote)</h1>
    <button id="connectBtn">Bluetooth Sender verbinden</button>
    <div id="status">Nicht verbunden</div>

    <div class="container">
        <div class="team">
            <h2>Team A</h2>
            <div class="score" id="scoreA">0</div>
            <div id="statusA" style="font-size: 1rem; color: #888;">Warte auf Sender...</div>
        </div>
        <div class="team">
            <h2>Team B</h2>
            <div class="score" id="scoreB">15</div>
            <div id="statusB" style="font-size: 1rem; color: #888;">Warte auf Sender...</div>
        </div>
    </div>

    <script>
        let scoreA = 0;
        let scoreB = 0;
        let history = []; // Für Undo

        // Speicher für die Geräte-Zuordnung: { deviceId: 'A' } oder 'B'
        let devices = {};
        
        // Klick-Erkennungs-Timer pro Sender
        let clickData = {};

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Bitte Sender 1 (Team A) auswählen...";
                const deviceA = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['generic_access', 'human_interface_device']
                });
                
                devices[deviceA.id] = 'A';
                document.getElementById('statusA').innerText = "Verbunden: " + deviceA.name;

                statusDiv.innerText = "Bitte Sender 2 (Team B) auswählen...";
                const deviceB = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['generic_access', 'human_interface_device']
                });

                devices[deviceB.id] = 'B';
                document.getElementById('statusB').innerText = "Verbunden: " + deviceB.name;
                statusDiv.innerText = "Beide Sender erfolgreich verbunden!";

                // Verbindung herstellen (Beispiel über HID / GATT falls direkt unterstützt)
                // Hinweis: Da viele China-Fernbedienungen als Standard-Bluetooth-Tastatur (HID) gekoppelt werden, 
                // greift alternativ der globale Tastendruck-Listener unten, falls Web Bluetooth das Gerät direkt blockiert.

            } catch (error) {
                console.error("Fehler bei Bluetooth-Verbindung:", error);
                statusDiv.innerText = "Verbindung abgebrochen oder nicht unterstützt.";
            }
        });

        // Fallback / Ergänzung für Android (Kopplung via Android Bluetooth-Einstellungen):
        // Wenn die Fernbedienungen ganz normal als Bluetooth-Tastatur gekoppelt sind, 
        // fängt das Betriebssystem die Signale ab. 
        // Falls du exakte Unterscheidung per MAC willst, läuft das professionell über WebHID API:

        /* 
           WebHID API Integration für Bluetooth-Tastaturen:
           navigator.hid.requestDevice({ filters: [] })... 
           Dadurch liest der Browser direkt die Rohdaten der verbundenen USB/Bluetooth-HID-Devices aus 
           und sieht, *welches* Gerät den Tastendruck gesendet hat.
        */

        function handleButtonPress(team) {
            // Einfache Klick-Logik mit Doppelklick-Erkennung
            let now = new Date().getTime();
            if (!clickData[team]) {
                clickData[team] = { count: 0, lastTime: 0 };
            }

            if (now - clickData[team].lastTime < 400) {
                // Doppelklick erkannt -> Zurück (Undo)
                clickData[team].count++;
            } else {
                clickData[team].count = 1;
            }
            clickData[team].lastTime = now;

            setTimeout(() => {
                if (clickData[team].count === 1) {
                    // 1x Klicken: Punkt
                    if (team === 'A') { scoreA++; history.push('A'); }
                    if (team === 'B') { scoreB++; history.push('B'); }
                } else if (clickData[team].count >= 2) {
                    // 2x Klicken: Zurück
                    let lastTeam = history.pop();
                    if (lastTeam === 'A' && scoreA > 0) scoreA--;
                    if (lastTeam === 'B' && scoreB > 0) scoreB--;
                }
                clickData[team].count = 0;
                updateDisplay();
            }, 400);
        }

        function updateDisplay() {
            document.getElementById('scoreA').innerText = scoreA;
            document.getElementById('scoreB').innerText = scoreB;
        }

        // Tastatur-Lauscher (greift, sobald die Fernbedienungen als HID-Tastatur verbunden sind)
        window.addEventListener('keydown', (e) => {
            // Beispiel: Wenn Sender A z.B. 'PageUp' und Sender B 'PageDown' sendet (oder über WebHID ausgelesen)
            if (e.key === 'PageUp') { handleButtonPress('A'); }
            if (e.key === 'PageDown') { handleButtonPress('B'); }
        });
    </script>
</body>
</html>
